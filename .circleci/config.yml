version: 2.1

jobs:

  build:
    docker:
      - image: cimg/node:22.11
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: "STAGE 1 - Point npm at the Nexus proxy"
          command: |
            REG="${NEXUS_REGISTRY:-http://host.docker.internal:8081/repository/jenkins-npm-proxy/}"
            npm config set registry "$REG"
            echo "Node $(node -v)"
            echo "Registry: $(npm config get registry)"

      - run:
          name: "STAGE 2 - Dependencies via Nexus Repository"
          command: |
            set -o pipefail
            npm install --ignore-scripts --package-lock=true --no-audit --no-fund \
              --loglevel http 2>&1 | tee /tmp/npm-proxy.log
            N=$(grep -c "http fetch GET 200" /tmp/npm-proxy.log || true)
            echo ""
            echo "$N packages resolved through Nexus Repository"

      - run:
          name: "STAGE 3 - Compile"
          command: |
            npm run build:server
            ls -la build/app.js
            echo "Build succeeded: build/app.js ready"

workflows:
  build_only:
    jobs:
      - build