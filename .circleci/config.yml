version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22.11
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: "STAGE 1 - Source"
          command: |
            echo "Node $(node -v)"
            echo "Registry: $(npm config get registry)"
      - run:
          name: "STAGE 2 - Dependencies"
          command: npm install --ignore-scripts --no-audit --no-fund
      - run:
          name: "STAGE 3 - Compile"
          command: |
            npm run build:server
            ls -la build/app.js
            echo "Build succeeded: build/app.js ready"

workflows:
  build_only:
    jobs:
      - build